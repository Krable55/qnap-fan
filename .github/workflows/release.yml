name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binary (musl, native x86_64 — no cross-linker needed)
        run: cargo build --release --target x86_64-unknown-linux-musl -p qfand

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/qfand

      - name: Package .txz
        id: package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PKG_NAME="qnap-fan-${VERSION}.txz"
          SHA_NAME="${PKG_NAME}.sha256"

          mkdir -p pkg/usr/local/sbin
          mkdir -p pkg/etc/rc.d
          mkdir -p pkg/usr/local/emhttp/plugins/qnap-fan

          cp target/x86_64-unknown-linux-musl/release/qfand pkg/usr/local/sbin/
          cp plugin/rc.qfand                                 pkg/etc/rc.d/
          cp plugin/qnap-fan.page                            pkg/usr/local/emhttp/plugins/qnap-fan/
          cp plugin/config.default.toml                      pkg/usr/local/emhttp/plugins/qnap-fan/

          chmod 755 pkg/usr/local/sbin/qfand
          chmod 755 pkg/etc/rc.d/rc.qfand

          ( cd pkg && tar -cJf "../${PKG_NAME}" --owner=root --group=root . )

          sha256sum "${PKG_NAME}" > "${SHA_NAME}"

          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_name=${SHA_NAME}"  >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "qnap-fan ${{ steps.version.outputs.version }}"
          body: |
            ## qnap-fan ${{ steps.version.outputs.version }}

            Fan control daemon for QNAP TVS-1288 on Unraid.

            **Install:** add `qnap-fan.plg` via the Unraid Plugins tab, or paste the raw URL.

            **Verify before installing:**
            ```
            sha256sum -c qnap-fan-${{ steps.version.outputs.version }}.txz.sha256
            ```
          files: |
            ${{ steps.package.outputs.pkg_name }}
            ${{ steps.package.outputs.sha_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
