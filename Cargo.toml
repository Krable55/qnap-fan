[workspace]
resolver = "2"
members = [
    "crates/qfan-core",
    "crates/qfan-hal",
    "crates/qfan-hist",
    "crates/qfan-proto",
    "crates/qfand",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kyle Rable <krable55@gmail.com>"]
repository = "https://github.com/krable55/qnap-fan"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
clap = { version = "4", features = ["derive"] }
